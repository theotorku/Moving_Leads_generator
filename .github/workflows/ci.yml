name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Populated from repo secrets; the live-DB job is skipped when unset.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit/API tests (mocked)
        run: python -m pytest -q

      # Schema-dependent smoke tests against a real Supabase project. Set the
      # SUPABASE_* / OPENAI / ADMIN secrets (ideally a dedicated test project or
      # branch) to enable. Skipped automatically when secrets are absent.
      - name: Supabase smoke tests (live DB)
        if: env.SUPABASE_URL != ''
        env:
          RUN_SUPABASE_IT: "1"
        run: python -m pytest -q tests/integration

      # Don't let a missing secret read as "all green" — surface the skip loudly.
      - name: Notice — live DB smoke tests skipped (no SUPABASE_URL secret)
        if: env.SUPABASE_URL == ''
        run: echo "::warning::Supabase smoke tests were SKIPPED because SUPABASE_URL is unset. Add SUPABASE_URL/SUPABASE_KEY/OPENAI_API_KEY/ADMIN_USERNAME/ADMIN_PASSWORD repo secrets (a dedicated test project/branch) to run them."

  e2e:
    # Browser E2E for the Command Center select-lead -> recommendation flow.
    # Needs the same live-DB secrets as the smoke tests, plus a headless browser.
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Skip when live-DB secrets are unset
        if: env.SUPABASE_URL == ''
        run: echo "::warning::Browser E2E SKIPPED (no SUPABASE_URL secret)."
      - name: Install Playwright + Chromium
        if: env.SUPABASE_URL != ''
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Command Center browser E2E
        if: env.SUPABASE_URL != ''
        env:
          RUN_E2E: "1"
        run: python -m pytest -q tests/e2e
      - name: Upload E2E traces/screenshots on failure
        if: failure() && env.SUPABASE_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: tests/e2e/artifacts/
          if-no-files-found: ignore
